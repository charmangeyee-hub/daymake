# Daymark — Netlify config (static PWA; backend is Supabase)
[build]
  publish = "."

# Always revalidate the service worker and shell so updates ship on reload.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
